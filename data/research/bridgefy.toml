NoCVE = "no CVE requested"
Credit = "With Martin R. Albrecht and Kenneth G. Paterson. Published at USENIX Security 2022."
Summary = "Read Signal-encrypted private chats in a Bluetooth mesh messenger through a race in its libsignal integration."
Description ="The mesh messenger had adopted libsignal after earlier attacks. A race between queuing a message and fetching its key let an attacker read Signal-encrypted private chats anyway. Broadcasts were recoverable without the network key, and impersonation, interception, and user tracking still worked."


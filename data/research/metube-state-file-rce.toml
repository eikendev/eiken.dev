Summary = "A client with access to the MeTube API could plant a queue file in MeTube's state directory that runs a shell command after restart."
Description ="The official image keeps MeTube's state files inside the download directory, and a download may pick any folder inside it. An attacker could download a crafted `pending.json` into `.metube`. After the next restart MeTube loaded it as a queued item, and starting that item made yt-dlp run the command stored in its options as the MeTube user."


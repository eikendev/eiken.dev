{{/* Chart.js canvas. Set `chartjs: true` in the post's front matter to load the
	library (see head.html), then reference this chart's id.
*/}}
<div
	class="mx-auto mb-6 overflow-auto rounded-2xl border border-outlinev bg-s1 p-4"
	style="position:relative; height:{{ .Get "height" }}px; max-width:{{ .Get "width" }}px"
>
	<canvas
		class="mx-auto"
		id="chart-{{ .Get "id" }}"
		style="width:100%"
	></canvas>
</div>
{{ with .Get "id" }}
	<script src="{{ . }}.js" data-name="chart-{{ . }}" defer></script>
{{ end }}

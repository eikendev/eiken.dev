<footer class="relative z-1 mt-10 border-t border-outlinev">
	<div
		class="mx-auto flex max-w-[1100px] flex-wrap items-center gap-x-6 gap-y-4 px-[clamp(16px,4vw,24px)] py-7 font-mono text-xs text-onv"
	>
		<span>{{ site.Params.copyright }}</span>
		<span class="ml-auto flex flex-wrap gap-5">
			{{ range hugo.Data.links.footer }}
				<a
					href="{{ .url | relURL }}"
					class="transition-colors hover:text-primary!"
					>{{ .name }}</a
				>
			{{ end }}
		</span>
	</div>
</footer>

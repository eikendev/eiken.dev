<section
	id="contact"
	class="mt-[clamp(56px,7vw,80px)] grid grid-cols-[repeat(auto-fit,minmax(260px,1fr))] items-center gap-7 rounded-3xl border border-outlinev bg-s1 p-[clamp(24px,4vw,40px)]"
>
	<div>
		<h2 class="m-0 mb-2 text-2xl font-semibold tracking-[-.02em]">
			{{ site.Params.contact.title }}
		</h2>
		<p class="m-0 max-w-[46ch] text-[15px] leading-[1.6] text-onv">
			{{ site.Params.contact.body }}
		</p>
	</div>
	<div class="flex flex-wrap gap-3">
		{{ range hugo.Data.links.contact }}
			<a
				href="{{ .url }}"
				class="{{ .class }} inline-flex h-11 items-center gap-2.5 rounded-full px-[22px] text-sm font-semibold transition"
			>
				{{ partial "icon.html" (dict "name" .icon "size" 16) }}
				{{ .name }}
			</a>
		{{ end }}
	</div>
</section>

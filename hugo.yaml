baseURL: "https://www.eiken.dev/"
locale: "en-US"
title: "eikendev"
disableHugoGeneratorInject: true
enableRobotsTXT: true
enableGitInfo: true
pluralizeListTitles: false

taxonomies:
  tag: "tags"

services:
  rss:
    limit: 20

permalinks:
  blog: "blog/:year/:month/:title/"

sitemap:
  changefreq: "weekly"
  filename: "sitemap.xml"
  priority: 0.5

minify:
  minifyOutput: true

# tailwindcss is not in Hugo's default security.exec.allow list.
security:
  exec:
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

# Tailwind reads the class list Hugo writes to hugo_stats.json while building.
# Declaring any mount removes the default assets mount, so it is re-declared,
# along with the JS dependencies (Chart.js, FontAwesome) and the self-hosted
# fonts, all mounted straight out of node_modules.
build:
  buildStats:
    enable: true
  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: css
module:
  mounts:
    - source: assets
      target: assets
    - source: static
      target: static
    - source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
      disableWatch: true
    - source: node_modules/chart.js/dist/chart.js
      target: assets/js/chart.js
    - source: node_modules/chart.js/dist/chunks/helpers.dataset.js
      target: assets/js/chunks/helpers.dataset.js
    - source: node_modules/katex/dist
      target: static/katex
    - source: node_modules/@fortawesome/fontawesome-free/svgs
      target: assets/icons/fontawesome
    - source: node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2
      target: static/fonts/ibm-plex-sans/ibm-plex-sans-latin-400-normal.woff2
    - source: node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2
      target: static/fonts/ibm-plex-sans/ibm-plex-sans-latin-500-normal.woff2
    - source: node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2
      target: static/fonts/ibm-plex-sans/ibm-plex-sans-latin-600-normal.woff2
    - source: node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-700-normal.woff2
      target: static/fonts/ibm-plex-sans/ibm-plex-sans-latin-700-normal.woff2
    - source: node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2
      target: static/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2
    - source: node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2
      target: static/fonts/ibm-plex-mono/ibm-plex-mono-latin-500-normal.woff2
    - source: node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2
      target: static/fonts/ibm-plex-mono/ibm-plex-mono-latin-600-normal.woff2

params:
  title: "eikendev"
  description: "Coding projects and blog posts by eikendev. Always happy to learn something new. Also interested in infosec? Join my journey!"
  keywords: "coding, programming, projects, infosec, information security, system security, portfolio"
  copyright: "Copyright © eikendev"
  themeColor: "#111111"
  showLastmod: true
  images:
    - "/img/card.png"
  author:
    name: "eikendev"
    email: "hello@eiken.dev"
  social:
    github: "eikendev"
    gitlab: "eikendev"
    twitter: "eikendev"
    bluesky: "@eikendev.bsky.social"
    blueskyurl: "https://bsky.app/profile/eikendev.bsky.social"

  headline: "Hello world."
  intro: >-
    My name is Raphael. I have a big passion for information security and security
    engineering. Below you'll find some projects of mine that I'd love for you to
    check out. If you have any thoughts, suggestions, or just want to chat about all
    things tech, don't be shy and reach out!
  roles:
    - "security engineering"
    - "cybersecurity"
    - "reverse engineering"
    - "rust and go"
    - "linux tinkering"
  contact:
    title: "Say hello."
    body: "Thoughts, suggestions, or just want to chat about all things tech? Reach out."

markup:
  highlight:
    codeFences: true
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    tabWidth: 4
  goldmark:
    extensions:
      footnote: true
      strikethrough: true
      table: true
      taskList: true
      typographer:
        leftAngleQuote: "&lt;&lt;"
        rightAngleQuote: "&gt;&gt;"
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ["$$", "$$"]
          inline:
            - ['\(', '\)']
        enable: true
    parser:
      autoHeadingIDType: "blackfriday"
    renderer:
      unsafe: true

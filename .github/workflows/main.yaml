name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `make test` builds the site; Hugo uses Git info for .Lastmod (enableGitInfo).
          persist-credentials: false

      - name: Test
        run: make test

  deploy:
    name: Build and Deploy
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # `peaceiris/actions-gh-pages` pushes the built site to the `html` branch.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Hugo uses Git information to fetch .Lastmod information (enableGitInfo).
          persist-credentials: false

      - name: Build
        run: make build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          force_orphan: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: html
          publish_dir: ./public
